name: .NET Build, Dafny and Test 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    # Dafny stuff
    - name: Setup Dafny
      uses: dafny-lang/setup-dafny-action@v1.9.1
      with:
        dafny-version: '4.11.0'
    - name: Check Dafny installation
      run: dafny --version
    - name: Verify Dafny code
      run: |
        dafny verify src/Dafny/WrappedModule.dfy \
          --verify-included-files
    - name: Generate C# from Dafny
      run: |
        dafny translate cs src/Dafny/WrappedModule.dfy \
          --output src/Dafny/WrappedModule.cs \
          --verify-included-files \
          --allow-warnings \
          --allow-external-contracts

    # Restore and compile dotnet
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    
    # Run tests
    - name: Test
      run: dotnet test --no-build --verbosity normal