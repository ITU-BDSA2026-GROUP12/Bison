name: Release Bison

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish Windows
        run: dotnet publish Bison.CLI.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/win-x64

      - name: Publish macOS
        run: dotnet publish Bison.CLI.csproj -c Release -r osx-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/osx-x64

      - name: Publish Linux
        run: dotnet publish Bison.CLI.csproj -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/linux-x64

      - name: Zip Windows build
        run: cd publish/win-x64 && zip -r ../../bison-win-x64.zip .

      - name: Zip macOS build
        run: cd publish/osx-x64 && zip -r ../../bison-osx-x64.zip .

      - name: Zip Linux build
        run: cd publish/linux-x64 && zip -r ../../bison-linux-x64.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bison-win-x64.zip
            bison-osx-x64.zip
            bison-linux-x64.zip