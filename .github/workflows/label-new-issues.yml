#workflow name on GithUb
name: Label issues

on: #Defines when workflow should start
  issues: #runs workflow when something happens to an issue
    types: [opened,closed,reopened]

permissions: #what the workflow is allowed to change
  issues: write

jobs: #defines the work that workflow should perform
  label-new: #if we add an issue, it'll be labled 'new-issue'
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Add new-issue label
        uses: actions/github-script@v7
        with: 
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number, 
              labels: ['new-issue']
            })
  label-closed: #if we finish an issue, it'll be labled 'finished'
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Add label for closed issues
        uses: actions/github-script@v7
        with: 
          script: |
            github.rest.issues.removeLabel({ //Removes label saying 'new-issue'
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'new-issue'
            })
            github.rest.issues.addLabels({ //adds label saying 'finished'
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number, 
              labels: ['finished']
            })
  label-reopened: #if we reopen an issue, the issue will be labeled 'new-issue' again
    if: github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Add reopened label   
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.removeLabel({ //Removes label saying 'finished'
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'finished'
            }) 
            github.rest.issues.addLabels({ //adds label saying 'new-issue'
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number, 
              labels: ['new-issue']
            })       

