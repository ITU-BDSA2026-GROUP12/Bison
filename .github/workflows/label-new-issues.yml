#workflow name on GithUb
name: Label new issues

on: #Defines when workflow should start
  issues: #runs workflow when something happens to an issue
    types: [opened]

permissions: #what the workflow is allowed to change
  issues: write

jobs: #defines the work that workflow should perform
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add new-issue label
        uses: actions/github-script@v7
        with: 
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number, 
              labels: ['new-issue']
            })
